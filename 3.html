<!DOCTYPE html>
<html>
<head>
    <title>Average Marks and Grade</title>
</head>
<body>

<h2>Student Marks</h2>

<script>
var m1 = parseFloat(prompt("Enter marks of Subject 1:"));
var m2 = parseFloat(prompt("Enter marks of Subject 2:"));
var m3 = parseFloat(prompt("Enter marks of Subject 3:"));
var m4 = parseFloat(prompt("Enter marks of Subject 4:"));
var m5 = parseFloat(prompt("Enter marks of Subject 5:"));

var average = (m1 + m2 + m3 + m4 + m5) / 5;
var grade;

if (average >= 90) {
    grade = "A+";
}
else if (average >= 80) {
    grade = "A";
}
else if (average >= 70) {
    grade = "B";
}
else if (average >= 60) {
    grade = "C";
}
else if (average >= 50) {
    grade = "D";
}
else {
    grade = "F";
}

alert("Average Marks = " + average + "\nGrade = " + grade);
</script>

</body>
</html>
