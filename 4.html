<!DOCTYPE html>
<html>
<head>
    <title>Factorial</title>
</head>
<body>

<h2>Factorial of a Number</h2>

<script>
function factorial(n) {
    var fact = 1;

    for (var i = 1; i <= n; i++) {
        fact = fact * i;
    }

    return fact;
}

var num = parseInt(prompt("Enter a number:"));

if (num < 0) {
    alert("Factorial is not defined for negative numbers.");
}
else {
    alert("Factorial of " + num + " = " + factorial(num));
}
</script>

</body>
</html>
