<!DOCTYPE html>
<html>
<head>
    <title>Reverse Number</title>
</head>
<body>

<h2>Reverse a Number</h2>

<script>
function reverseNumber(num) {
    var reverse = 0;

    while (num != 0) {
        var digit = num % 10;
        reverse = reverse * 10 + digit;
        num = Math.floor(num / 10);
    }

    return reverse;
}

var num = parseInt(prompt("Enter a number:"));

alert("Reverse of " + num + " is " + reverseNumber(num));
</script>

</body>
</html>
