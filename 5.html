<!DOCTYPE html>
<html>
<head>
    <title>Three Numbers</title>
</head>
<body>

<h2>Three Integer Operations</h2>

<script>
var a = parseInt(prompt("Enter first integer:"));
var b = parseInt(prompt("Enter second integer:"));
var c = parseInt(prompt("Enter third integer:"));

var sum = a + b + c;
var average = sum / 3;
var largest = Math.max(a, b, c);

alert(
    "Sum = " + sum +
    "\nAverage = " + average +
    "\nLargest = " + largest
);
</script>

</body>
</html>
