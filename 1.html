<!DOCTYPE html>
<html>
<head>
    <title>Palindrome Check</title>
</head>
<body>

<h2>Palindrome Check</h2>

<script>
function checkPalindrome(str) {
    var reverse = str.split("").reverse().join("");

    if (str === reverse) {
        alert(str + " is a Palindrome");
    } else {
        alert(str + " is not a Palindrome");
    }
}

var str = prompt("Enter a string:");
checkPalindrome(str);
</script>

</body>
</html>
